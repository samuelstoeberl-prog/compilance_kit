version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: compliancekit
      POSTGRES_USER: ck_user
      POSTGRES_PASSWORD: ck_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/db/schema.sql:/docker-entrypoint-initdb.d/schema.sql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://ck_user:ck_password@postgres:5432/compliancekit
      PORT: 3001
      FRONTEND_URL: http://localhost:5173
      NODE_ENV: development
    ports:
      - "3001:3001"
    volumes:
      - ./src/data:/app/src/data:ro  # Scraper-Ergebnisse live einlesen

volumes:
  pgdata:
